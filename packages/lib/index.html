<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W1C library demo</title>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <main class="demo-shell">
      <w1c-window title="W1C Library Demo">
        <span slot="icon" aria-hidden="true">W</span>
        <div slot="controls" class="window-controls" aria-label="Window controls">
          <w1c-button aria-label="Minimize">_</w1c-button>
          <w1c-button aria-label="Maximize">□</w1c-button>
          <w1c-button aria-label="Close">x</w1c-button>
        </div>
        <w1c-toolbar slot="toolbar">
          <w1c-button>File</w1c-button>
          <w1c-button>Edit</w1c-button>
          <w1c-button>View</w1c-button>
        </w1c-toolbar>
        <h1>W1C</h1>
        <p>Retro web components with platform-native imports.</p>
        <w1c-button>Open Component Catalog</w1c-button>
        <w1c-statusbar slot="statusbar">All components registered</w1c-statusbar>
      </w1c-window>
    </main>
  </body>
</html>
